<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rykards Service Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Martian+Mono:wdth,wght@75..112.5,300..700&display=swap">
<style>
/* Layout concept: three role-specific workspaces sharing one type system.
   Floor = porcelain tablet app, Kitchen = steel rail with paper tickets, Stores = calm ledger desk. */
:root{
  --ground:#ECEEF1; --surface:#FFFFFF; --surface-2:#F5F6F8; --surface-3:#E3E6EB;
  --line:#D9DDE3; --line-2:#BDC3CD;
  --ink:#101318; --ink-2:#454B56; --ink-3:#6E7581;
  --accent:#2A43D4; --accent-ink:#2A43D4; --accent-soft:#E4E8FC; --on-accent:#FFFFFF;
  --ok:#11764A; --ok-soft:#DDF1E6; --warn:#9A5800; --warn-soft:#FAEED8; --bad:#BF2419; --bad-soft:#FBE3E0;
  --scrim:rgba(14,17,22,.44);
  --pop:0 1px 2px rgba(16,19,24,.06),0 14px 36px -10px rgba(16,19,24,.28);
  --f-sans:"Archivo",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Martian Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  /* Kitchen is always dark: glare-free on a pass, paper tickets on a steel rail */
  --k-rail:#0B0C0F; --k-bar:#121419; --k-line:#262A32; --k-ink:#ECEEF2; --k-ink-2:#9BA1AC;
  --k-paper:#F3F3EF; --k-paper-2:#E4E4DE; --k-paper-ink:#14161B; --k-paper-ink-2:#5A5E66;
  --k-fresh:#1C1F26; --k-watch:#F0A417; --k-late:#D6281D; --k-ready:#1E9B5C; --k-accent:#5E73FF;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0E1014; --surface:#161920; --surface-2:#1B1F27; --surface-3:#262B35;
  --line:#272C36; --line-2:#3B414D; --ink:#ECEEF2; --ink-2:#AEB4BF; --ink-3:#7F8693;
  --accent:#4359EC; --accent-ink:#A3AEFF; --accent-soft:#1C2250; --on-accent:#FFFFFF;
  --ok:#5FD39A; --ok-soft:#14291F; --warn:#F2B45A; --warn-soft:#2E2414; --bad:#FF8C82; --bad-soft:#341A18;
  --scrim:rgba(0,0,0,.62); --pop:0 1px 2px rgba(0,0,0,.4),0 18px 40px -10px rgba(0,0,0,.7); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0E1014; --surface:#161920; --surface-2:#1B1F27; --surface-3:#262B35;
  --line:#272C36; --line-2:#3B414D; --ink:#ECEEF2; --ink-2:#AEB4BF; --ink-3:#7F8693;
  --accent:#4359EC; --accent-ink:#A3AEFF; --accent-soft:#1C2250; --on-accent:#FFFFFF;
  --ok:#5FD39A; --ok-soft:#14291F; --warn:#F2B45A; --warn-soft:#2E2414; --bad:#FF8C82; --bad-soft:#341A18;
  --scrim:rgba(0,0,0,.62); --pop:0 1px 2px rgba(0,0,0,.4),0 18px 40px -10px rgba(0,0,0,.7); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#root{height:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:-.01em}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.boot{height:100%;display:grid;place-items:center;color:var(--ink-3);font-size:13px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- shared controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:8px;font-weight:600;font-size:14px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);transition:background .12s,border-color .12s,transform .06s;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.primary:hover{background:var(--ink-2)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.accent:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-3)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:7px}
.btn.lg{height:54px;padding:0 22px;font-size:16px;border-radius:10px}
.btn.block{width:100%}
.icon{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:5px;font-size:12px;font-weight:600;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.accent{background:var(--accent-soft);color:var(--accent-ink)}
.pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.seg{display:inline-flex;padding:3px;border-radius:9px;background:var(--surface-3);gap:2px}
.seg button{height:30px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.field{display:grid;gap:6px}
.field>span{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.input{height:42px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:0 12px;width:100%;min-width:0}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{height:auto;min-height:72px;padding:10px 12px;resize:vertical}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);overflow:hidden}
.stepper button{width:40px;height:40px;display:grid;place-items:center}
.stepper button:hover{background:var(--surface-2)}
.stepper .v{min-width:44px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.stepper.sm button{width:30px;height:30px}
.stepper.sm .v{min-width:28px;font-size:14px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3);display:grid;gap:6px;justify-items:center}
.empty b{color:var(--ink);font-size:16px}

/* sheets & drawers */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:grid;place-items:center;padding:16px;animation:fade .16s ease-out}
.sheet{background:var(--surface);border-radius:14px;box-shadow:var(--pop);width:min(520px,100%);max-height:calc(100% - 24px);display:flex;flex-direction:column;overflow:hidden;animation:rise .2s cubic-bezier(.2,.8,.2,1)}
.sheet-h{padding:18px 20px 12px;display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line)}
.sheet-h h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sheet-h p{margin:3px 0 0;color:var(--ink-3);font-size:13px}
.sheet-b{padding:16px 20px;overflow:auto;display:grid;gap:18px;grid-auto-rows:max-content;align-content:start}
.sheet-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:var(--surface-2)}
.x{margin-left:auto;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3);flex:none}
.x:hover{background:var(--surface-3);color:var(--ink)}
.drawer-wrap{position:fixed;inset:0;z-index:50;background:var(--scrim);animation:fade .16s}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);box-shadow:var(--pop);display:flex;flex-direction:column;animation:slide .22s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.985)}}
@keyframes slide{from{transform:translateX(24px);opacity:.4}}

/* toasts */
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;display:grid;gap:8px;justify-items:center;width:min(560px,calc(100% - 32px));pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:10px;background:#16181E;color:#F1F2F5;box-shadow:0 12px 30px -8px rgba(0,0,0,.45);font-size:14px;animation:rise .2s;max-width:100%}
.toast .t-ic{color:#7DE0A8;display:grid}
.toast.warn .t-ic{color:#F6BF5E}
.toast b{font-weight:600}
.toast .act{margin-left:6px;height:32px;padding:0 12px;border-radius:7px;background:rgba(255,255,255,.12);font-weight:600;font-size:13px}
.toast .act:hover{background:rgba(255,255,255,.2)}

/* prototype switcher */
.proto{position:fixed;right:0;top:50%;z-index:70}
.proto-btn{position:absolute;right:0;top:0;transform-origin:100% 100%;transform:translateY(-100%) rotate(-90deg);height:28px;padding:0 12px;border-radius:8px 8px 0 0;background:#16181E;color:#E8EAEE;font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px;box-shadow:0 6px 18px -6px rgba(0,0,0,.5);letter-spacing:.02em}
.proto-btn i{width:7px;height:7px;border-radius:50%;background:#F0A417;display:block}
.proto-pop{position:absolute;right:36px;top:0;transform:translateY(-50%);width:330px;max-width:calc(100vw - 28px);max-height:min(560px,calc(100vh - 80px));overflow:auto;background:#16181E;color:#E8EAEE;border-radius:12px;box-shadow:0 20px 50px -10px rgba(0,0,0,.6);padding:14px;display:grid;gap:12px;animation:rise .18s}
.proto-pop h4{margin:0;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#8C929D;font-weight:700}
.proto-pop p{margin:0;font-size:12.5px;color:#A9AFB9;line-height:1.5}
.proto-list{display:grid;gap:2px}
.proto-list button{display:flex;justify-content:space-between;gap:10px;text-align:left;padding:8px 10px;border-radius:7px;font-size:13px}
.proto-list button:hover{background:rgba(255,255,255,.07)}
.proto-list button.cur{background:rgba(94,115,255,.22)}
.proto-list small{color:#8C929D;font-size:12px}
.proto-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.tog{width:38px;height:22px;border-radius:999px;background:#3A3F49;position:relative;flex:none;transition:background .15s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.tog.on{background:#3E9B6A}
.tog.on::after{transform:translateX(16px)}
.proto-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:3px;border-radius:9px;background:rgba(255,255,255,.07)}
.proto-seg button{height:30px;border-radius:7px;font-size:12.5px;font-weight:600;color:#A9AFB9}
.proto-seg button:hover{color:#fff}
.proto-seg button.on{background:#E8EAEE;color:#16181E}
.proto-pop .reset{height:32px;border-radius:7px;background:rgba(255,255,255,.08);font-size:12.5px;font-weight:600}

/* ---------- sign in ---------- */
.signin{height:100%;display:grid;grid-template-columns:minmax(300px,38%) 1fr;overflow:hidden}
.si-side{background:#101318;color:#EDEFF3;padding:36px 40px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.si-side::after{content:"";position:absolute;inset:auto -20% -30% auto;width:520px;height:520px;border-radius:50%;border:1px solid rgba(255,255,255,.06);box-shadow:0 0 0 70px rgba(255,255,255,.015),0 0 0 140px rgba(255,255,255,.012)}
.wordmark{display:flex;align-items:baseline;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em;font-stretch:90%}
.wordmark span{font-weight:500;font-size:12px;letter-spacing:.08em;color:#8E95A1;font-stretch:100%;text-transform:uppercase}
.si-clock{margin-top:auto;font-size:clamp(72px,10vw,132px);font-weight:300;font-stretch:72%;letter-spacing:-.04em;line-height:.9;font-variant-numeric:tabular-nums}
.si-date{font-size:20px;font-weight:500;color:#C9CED6;margin-top:10px}
.si-service{display:flex;align-items:center;gap:8px;color:#8E95A1;font-size:14px;margin-top:2px}
.si-service .d{width:7px;height:7px;border-radius:50%;background:#3EC27F;box-shadow:0 0 0 4px rgba(62,194,127,.15)}
.si-note{margin:28px 0 0;color:#8E95A1;font-size:13px;max-width:34ch;line-height:1.55;position:relative;z-index:1}
.si-main{overflow:auto;padding:36px clamp(16px,4vw,56px) 80px}
.si-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px}
.si-head h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.02em;font-stretch:92%;text-wrap:balance}
.si-head p{margin:4px 0 0;color:var(--ink-3)}
.si-group{margin-bottom:28px}
.si-group h2{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.si-group h2::after{content:"";flex:1;height:1px;background:var(--line)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.person{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);text-align:left;transition:border-color .12s,transform .08s}
.person:hover{border-color:var(--ink-3)}
.person:active{transform:scale(.99)}
.mono-av{width:42px;height:42px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;font-stretch:90%;letter-spacing:.02em}
.av-floor{background:var(--accent-soft);color:var(--accent-ink)}
.av-kitchen{background:#1C1F26;color:#F3F3EF}
.av-stores{background:var(--ok-soft);color:var(--ok)}
.person b{display:block;font-weight:600;font-size:15px}
.person small{display:block;color:var(--ink-3);font-size:13px;margin-top:1px}
.person .icon{margin-left:auto;color:var(--ink-3)}
.pin{width:min(360px,100%)}
.pin .sheet-b{justify-items:center;text-align:center;gap:14px;padding-top:24px}
.pin-dots{display:flex;gap:14px;height:18px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);transition:all .12s}
.pin-dots i.f{background:var(--ink);border-color:var(--ink)}
.pin-dots.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:10px}
.keypad button{height:62px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.keypad button:hover{background:var(--surface-3)}
.keypad button:active{transform:scale(.96)}
.keypad button.fn{font-size:13px;font-weight:600;color:var(--ink-3);background:transparent;border-color:transparent}
@media (max-width:760px){
  .signin{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow:auto;height:auto;min-height:100%}
  .si-side{padding:22px 16px 20px}
  .si-clock{font-size:64px;margin-top:22px}
  .si-note{display:none}
  .si-main{overflow:visible;padding:24px 16px 80px}
  .si-head h1{font-size:24px}
}

/* ---------- WAITER: floor app ---------- */
.wt{height:100%;display:grid;grid-template-columns:84px minmax(0,1fr);grid-template-rows:60px minmax(0,1fr);background:var(--ground)}
.wt-top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px 0 0;background:var(--surface);border-bottom:1px solid var(--line)}
.wt-brand{width:84px;align-self:stretch;display:grid;place-items:center;border-right:1px solid var(--line);font-weight:800;font-size:18px;font-stretch:80%;letter-spacing:-.02em}
.wt-venue{display:grid;line-height:1.15}
.wt-venue b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.wt-venue small{color:var(--ink-3);font-size:12.5px}
.wt-top .sp{flex:1}
.wt-clock{font-family:var(--f-mono);font-size:13px;color:var(--ink-2)}
.pick-btn{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:9px;border:1px solid var(--line-2);font-weight:600;font-size:14px}
.pick-btn.hot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pick-btn .n{min-width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--surface-3);color:var(--ink);font-size:12px;font-variant-numeric:tabular-nums}
.pick-btn.hot .n{background:rgba(255,255,255,.22);color:inherit}
.me{display:flex;align-items:center;gap:9px;height:40px;padding:0 6px 0 4px;border-radius:9px}
.me:hover{background:var(--surface-2)}
.me .mono-av{width:32px;height:32px;font-size:12px;border-radius:7px}
.me span{font-size:14px;font-weight:600}
.wt-rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:10px 8px}
.rail-btn{display:grid;justify-items:center;gap:4px;padding:10px 4px 8px;border-radius:10px;font-size:11.5px;font-weight:600;color:var(--ink-3);position:relative}
.rail-btn .icon{width:22px;height:22px}
.rail-btn:hover{color:var(--ink);background:var(--surface-2)}
.rail-btn.on{background:var(--surface-3);color:var(--ink)}
.rail-btn .badge{position:absolute;top:5px;right:10px;min-width:18px;height:18px;padding:0 4px;border-radius:5px;background:var(--accent);color:var(--on-accent);font-size:11px;display:grid;place-items:center}
.wt-main{min-width:0;min-height:0;overflow:auto}
.page{padding:22px clamp(16px,2.4vw,32px) 90px;display:grid;gap:18px;align-content:start}
.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px}
.page-h h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em;font-stretch:92%}
.page-h .sub{color:var(--ink-3);font-size:14px;margin-top:2px}
.page-h .tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--ink-3);display:inline-block}
.sw.free{border-style:dashed;border-color:var(--line-2);background:var(--surface)}
.sw.seat{background:var(--surface);border-color:var(--ink)}
.sw.ready{background:var(--accent);border-color:var(--accent)}
.sw.bill{background:repeating-linear-gradient(135deg,var(--surface-3) 0 3px,var(--surface) 3px 6px);border-color:var(--ink-2)}

/* floor plan */
.plan-wrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;overflow:auto}
.plan{position:relative;width:100%;min-width:640px;aspect-ratio:16/9;border-radius:8px;background-color:var(--surface-2);background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:22px 22px}
.plan .zone{position:absolute;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.plan .struct{position:absolute;border:1.5px solid var(--line-2);background:var(--surface-3);border-radius:4px;display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.04em;text-align:center;padding:2px}
.plan .rail-line{position:absolute;height:0;border-top:2px dashed var(--line-2)}
.tbl{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;align-content:center;gap:1px;background:var(--surface);border:1.5px solid var(--ink-2);color:var(--ink);transition:transform .12s,box-shadow .12s;cursor:pointer;padding:0}
.tbl:hover{transform:translate(-50%,-50%) scale(1.04);box-shadow:0 8px 20px -10px rgba(0,0,0,.35)}
.tbl.round{border-radius:50%;aspect-ratio:1}
.tbl.square{border-radius:8px;aspect-ratio:1}
.tbl.long{border-radius:10px;aspect-ratio:2.6}
.tbl .code{font-weight:800;font-size:clamp(12px,1.25vw,17px);font-stretch:80%;letter-spacing:-.01em;line-height:1}
.tbl .meta{font-size:clamp(9.5px,.85vw,11.5px);color:var(--ink-3);font-variant-numeric:tabular-nums;line-height:1.1}
.tbl.free{border-style:dashed;border-color:var(--line-2);color:var(--ink-3)}
.tbl.free .code{font-weight:600}
.tbl.ready{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tbl.ready .meta{color:rgba(255,255,255,.82)}
.tbl.ready::after{content:"";position:absolute;inset:-6px;border-radius:inherit;border:2px solid var(--accent);opacity:.5;animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(.94);opacity:.6}to{transform:scale(1.12);opacity:0}}
.tbl.bill{background:repeating-linear-gradient(135deg,var(--surface-3) 0 4px,var(--surface) 4px 8px)}
.tbl.other{opacity:.5}
.tbl .flag{position:absolute;top:-9px;right:-9px;height:18px;padding:0 5px;border-radius:5px;font-size:10.5px;font-weight:700;display:grid;place-items:center;background:var(--bad);color:#fff}
.tbl .who{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);height:16px;padding:0 5px;border-radius:4px;background:var(--ink);color:var(--surface);font-size:9.5px;font-weight:700;display:grid;place-items:center;letter-spacing:.04em}
.chair{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--line-2);transform:translate(-50%,-50%);pointer-events:none}
.tbl.ready .chair{background:color-mix(in srgb,var(--accent) 60%,var(--surface))}
/* table list (phone & list mode) */
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tcard{display:grid;gap:8px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left}
.tcard:hover{border-color:var(--ink-3)}
.tcard .top{display:flex;align-items:center;gap:10px}
.tcard .code{font-size:22px;font-weight:800;font-stretch:80%}
.tcard.ready{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tcard.free{border-style:dashed}
.tcard .line{font-size:13px;color:var(--ink-3)}

/* order screen */
.order{height:100%;display:grid;grid-template-columns:172px minmax(0,1fr) minmax(330px,390px);grid-template-rows:auto minmax(0,1fr);min-height:0}
.ord-h{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.ord-h .tno{font-size:26px;font-weight:800;font-stretch:78%;letter-spacing:-.02em;line-height:1}
.ord-h .facts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ord-h .search{margin-left:auto;position:relative;width:min(320px,100%)}
.ord-h .search .icon{position:absolute;left:11px;top:12px;color:var(--ink-3)}
.ord-h .search .input{padding-left:36px;height:42px}
.ord-h .search kbd{position:absolute;right:9px;top:10px;font-family:var(--f-mono);font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.sections{border-right:1px solid var(--line);background:var(--surface);overflow:auto;padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.sec-btn{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:12px 12px;border-radius:9px;text-align:left;font-weight:600;font-size:14.5px;color:var(--ink-2)}
.sec-btn small{font-weight:500;color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.sec-btn:hover{background:var(--surface-2);color:var(--ink)}
.sec-btn.on{background:var(--ink);color:var(--surface)}
.sec-btn.on small{color:inherit;opacity:.7}
.items{overflow:auto;padding:16px;min-width:0}
.items-h{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
.items-h h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.items-h .muted{font-size:13px}
.grid-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.item{position:relative;display:flex;flex-direction:column;gap:6px;min-height:118px;padding:13px 13px 12px;border-radius:11px;background:var(--surface);border:1px solid var(--line);text-align:left;transition:border-color .12s,transform .08s}
.item:hover{border-color:var(--ink-3)}
.item:active{transform:scale(.985)}
.item .nm{font-weight:650;font-size:15px;line-height:1.25;text-wrap:balance;font-weight:600}
.item .ds{font-size:12.5px;color:var(--ink-3);line-height:1.35}
.item .ft{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.item .pr{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.item .st{font-family:var(--f-mono);font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.02em}
.item.out{opacity:.5;cursor:not-allowed}
.item.out .pr{text-decoration:line-through}
.item .stock{position:absolute;top:10px;right:10px}
.item.flash{animation:flash .45s}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--accent)}40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.item .mods-ind{position:absolute;bottom:12px;right:12px}
.check{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.check-h{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.seats{display:flex;gap:6px;flex-wrap:wrap}
.seats button{height:34px;min-width:38px;padding:0 10px;border-radius:8px;border:1px solid var(--line-2);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;flex:none}
.seats button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.check-b{flex:1;overflow:auto;padding:6px 0 10px}
.grp-h{display:flex;align-items:center;gap:8px;padding:12px 14px 6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.grp-h .pill{text-transform:none;letter-spacing:0}
.grp-h .r{margin-left:auto}
.ln{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;padding:9px 14px;align-items:start;border-bottom:1px solid var(--line)}
.ln:last-child{border-bottom:0}
.ln.new{background:transparent}
.ln.hl{animation:hl 1s}
@keyframes hl{from{background:var(--accent-soft)}}
.ln .q{font-weight:700;font-variant-numeric:tabular-nums;min-width:26px;height:26px;border-radius:6px;background:var(--surface-3);display:grid;place-items:center;font-size:13px}
.ln .body{min-width:0;text-align:left}
.ln .body b{font-weight:600;font-size:14.5px;display:block}
.ln .sub{font-size:12.5px;color:var(--ink-3);line-height:1.35}
.ln .note{font-size:12.5px;color:var(--warn);font-weight:500}
.ln .note.alg{color:var(--bad);font-weight:600}
.ln .amt{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;text-align:right}
.ln .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.ln.sent{color:var(--ink-2)}
.ln.void .body b,.ln.void .amt{text-decoration:line-through;color:var(--ink-3)}
.ln .ctl{grid-column:2/-1;display:flex;align-items:center;gap:8px;margin-top:4px}
.check-f{border-top:1px solid var(--line);padding:12px 14px 14px;display:grid;gap:10px;background:var(--surface-2)}
.tot{display:grid;gap:3px;font-size:13.5px}
.tot div{display:flex;justify-content:space-between;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tot .grand{font-size:19px;font-weight:700;color:var(--ink);margin-top:4px}
.check-f .row{display:grid;grid-template-columns:auto 1fr;gap:8px}
.check-empty{padding:34px 22px;text-align:center;color:var(--ink-3);font-size:14px;line-height:1.5}
.check-empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.sec-chips,.areas,.ktabs,.inv-mtop .tabs{scrollbar-width:none}
.mob-check{display:none}
.sec-chips{display:none}
@media (max-width:1100px){
  .order{grid-template-columns:minmax(0,1fr) minmax(310px,360px)}
  .sections{display:none}
  .sec-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;margin-bottom:4px}
}
@media (max-width:760px){
  .wt{grid-template-columns:1fr;grid-template-rows:56px minmax(0,1fr) calc(64px + env(safe-area-inset-bottom,0px))}
  .wt-brand{display:none}
  .wt-top{padding:0 12px 0 16px}
  .wt-clock,.me span{display:none}
  .wt-rail{grid-row:3;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);padding:4px 8px env(safe-area-inset-bottom,0px)}
  .rail-btn{flex:1;padding:8px 4px}
  .order{grid-template-columns:1fr}
  .check{display:none}
  .check.open{display:flex;position:fixed;inset:0;z-index:40;border:0}
  .mob-check{display:flex;position:sticky;bottom:0;margin:0 -16px -16px;padding:10px 16px;background:var(--surface);border-top:1px solid var(--line);gap:10px;align-items:center}
  .ord-h .search{order:3;width:100%;margin:0}
  .page-h h1{font-size:24px}
  .grid-items{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}
.mods{display:grid;gap:16px}
.mod-g{display:grid;gap:8px}
.mod-g .gh{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{height:44px;padding:0 14px;border-radius:9px;border:1px solid var(--line-2);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;background:var(--surface)}
.opt small{font-weight:500;color:var(--ink-3)}
.opt.on{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.opt.on small{color:inherit;opacity:.75}
.opt.alg.on{background:var(--bad);border-color:var(--bad);color:#fff}

/* pickups & orders lists */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px;align-content:start}
.card.mine{border-color:var(--ink-3)}
.card .hd{display:flex;align-items:center;gap:10px}
.card .tno{font-size:28px;font-weight:800;font-stretch:76%;letter-spacing:-.02em;line-height:1}
.card .hd .r{margin-left:auto;text-align:right}
.card ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:14px}
.card li{display:flex;gap:8px}
.card li b{font-variant-numeric:tabular-nums;min-width:22px}
.prog{display:flex;gap:5px;flex-wrap:wrap}
.wait{font-family:var(--f-mono);font-size:12px}
.wait.warn{color:var(--warn)}
.wait.bad{color:var(--bad)}

/* ---------- KITCHEN: KDS ---------- */
.kds{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--k-rail);color:var(--k-ink);color-scheme:dark}
.kds-top{display:flex;align-items:center;gap:18px;padding:10px 18px;background:var(--k-bar);border-bottom:1px solid var(--k-line);flex-wrap:wrap}
.kds-st{display:grid;line-height:1.05}
.kds-st b{font-size:28px;font-weight:800;font-stretch:72%;letter-spacing:-.01em;text-transform:uppercase}
.kds-st small{font-size:12.5px;color:var(--k-ink-2);font-weight:500;letter-spacing:.02em}
.kstat{display:grid;line-height:1.1;padding-left:16px;border-left:1px solid var(--k-line)}
.kstat b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;font-stretch:85%}
.kstat small{font-size:11px;color:var(--k-ink-2);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.kstat.late b{color:#FF7A6E}
.kds-top .sp{flex:1}
.kbtn{height:42px;padding:0 14px;border-radius:9px;background:#1E2128;border:1px solid var(--k-line);color:var(--k-ink);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.kbtn:hover{background:#262A32}
.kbtn.on{background:var(--k-paper);color:var(--k-paper-ink);border-color:var(--k-paper)}
.kclock{font-family:var(--f-mono);font-size:20px;font-weight:500;letter-spacing:-.02em}
.ktabs{display:flex;gap:6px;padding:10px 18px 0;overflow-x:auto}
.ktab{height:38px;padding:0 14px;border-radius:9px 9px 0 0;background:transparent;color:var(--k-ink-2);font-weight:700;font-size:14px;letter-spacing:.02em;display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;border-bottom:0;flex:none}
.ktab .n{font-variant-numeric:tabular-nums;font-size:12px;min-width:20px;height:20px;border-radius:5px;background:#262A32;display:grid;place-items:center;padding:0 5px}
.ktab.on{background:#16181D;color:var(--k-ink);border-color:var(--k-line)}
.kbody{display:grid;grid-template-columns:minmax(0,1fr) auto;min-height:0}
.krail{overflow:auto;padding:16px 18px 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;align-content:start;align-items:start}
.krail.pass{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.kempty{grid-column:1/-1;padding:80px 20px;text-align:center;color:var(--k-ink-2)}
.kempty b{display:block;font-size:22px;color:var(--k-ink);font-weight:700;margin-bottom:6px}
.tk{background:var(--k-paper);color:var(--k-paper-ink);border-radius:4px 4px 0 0;display:flex;flex-direction:column;position:relative;padding-bottom:8px;
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 7px) no-repeat,conic-gradient(from 135deg at top,#000 90deg,#0000 0) bottom/14px 7px repeat-x;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - 7px) no-repeat,conic-gradient(from 135deg at top,#000 90deg,#0000 0) bottom/14px 7px repeat-x;animation:drop .35s cubic-bezier(.2,.8,.2,1)}
@keyframes drop{from{transform:translateY(-14px);opacity:0}}
.tk-h{padding:10px 12px 9px;background:var(--k-fresh);color:#F2F3F5;border-radius:4px 4px 0 0;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:end}
.tk.watch .tk-h{background:var(--k-watch);color:#1B1408}
.tk.late .tk-h{background:var(--k-late);color:#fff}
.tk.newk{box-shadow:0 0 0 3px var(--k-accent)}
.tk-h .t{font-size:34px;font-weight:800;font-stretch:70%;letter-spacing:-.02em;line-height:.95}
.tk-h .tm{font-family:var(--f-mono);font-size:21px;font-weight:600;letter-spacing:-.03em;text-align:right;line-height:1}
.tk-h .m{grid-column:1/-1;display:flex;gap:6px;font-size:12px;font-weight:600;opacity:.85;flex-wrap:wrap;align-items:center}
.tk-stamp{display:inline-block;padding:1px 6px;border:1.5px solid currentColor;border-radius:3px;font-size:10.5px;font-weight:800;letter-spacing:.08em}
.tk-slip{margin:8px 10px 0;padding:6px 9px;border-radius:4px;font-size:12.5px;font-weight:700;letter-spacing:.02em;display:flex;gap:6px;align-items:center}
.tk-slip.void{background:#FBE1DE;color:#A31A10}
.tk-slip.moved{background:#E3E7FF;color:#2A3AA8}
.tk-ls{padding:4px 0}
.tk-l{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;padding:8px 12px;text-align:left;width:100%;border-bottom:1px dashed var(--k-paper-2)}
.tk-l:last-child{border-bottom:0}
.tk-l .q{font-family:var(--f-mono);font-weight:700;font-size:17px;line-height:1.2}
.tk-l .n{font-weight:700;font-size:17px;line-height:1.2;font-stretch:92%}
.tk-l .md{font-size:13.5px;color:var(--k-paper-ink-2);font-weight:500;margin-top:1px}
.tk-l .md b{color:var(--k-paper-ink);font-weight:700}
.tk-l .nt{margin-top:4px;font-size:13px;font-weight:700;background:#F7E7B8;color:#5E4300;padding:2px 6px;border-radius:3px;display:inline-block}
.tk-l .nt.alg{background:#D6281D;color:#fff}
.tk-l .seat{font-family:var(--f-mono);font-size:11px;color:var(--k-paper-ink-2);margin-left:6px}
.tk-l.done .n,.tk-l.done .q,.tk-l.done .md{text-decoration:line-through;opacity:.38}
.tk-l.void .n,.tk-l.void .q{text-decoration:line-through;color:#A31A10}
.tk-f{display:flex;gap:8px;padding:6px 10px 4px;align-items:center}
.tk-f .info{font-size:12px;color:var(--k-paper-ink-2);font-weight:600}
.kgo{flex:1;height:52px;border-radius:7px;font-size:17px;font-weight:800;letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-transform:uppercase;font-stretch:88%}
.kgo.start{background:var(--k-paper-ink);color:var(--k-paper)}
.kgo.ready{background:var(--k-ready);color:#fff}
.kgo:active{transform:scale(.98)}
.ksmall{height:52px;width:52px;border-radius:7px;border:1.5px solid var(--k-paper-2);display:grid;place-items:center;color:var(--k-paper-ink-2)}
.kside{width:300px;background:var(--k-bar);border-left:1px solid var(--k-line);overflow:auto;padding:16px;display:grid;gap:12px;align-content:start}
.kside h3{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--k-ink-2)}
.ad-row{display:flex;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--k-line)}
.ad-row b{font-family:var(--f-mono);font-size:24px;font-weight:600;min-width:42px}
.ad-row span{font-weight:600;font-size:15px;line-height:1.25}
.ad-row small{display:block;color:var(--k-ink-2);font-size:12px;font-weight:500}
.rc-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px;border-radius:8px;background:#1A1D23;align-items:center}
.rc-row b{font-size:18px;font-stretch:78%;font-weight:800}
.rc-row small{color:var(--k-ink-2);font-size:12px;grid-column:1}
.kfoot{display:flex;gap:18px;align-items:center;padding:8px 18px;background:var(--k-bar);border-top:1px solid var(--k-line);font-size:12px;color:var(--k-ink-2);flex-wrap:wrap}
.kfoot span{display:inline-flex;align-items:center;gap:7px}
.kfoot i{width:12px;height:12px;border-radius:3px;display:block}
.kfoot .sp{flex:1}
/* pass view */
.po{background:#16181D;border:1px solid var(--k-line);border-radius:10px;overflow:hidden;animation:drop .35s}
.po-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--k-line)}
.po-h .t{font-size:30px;font-weight:800;font-stretch:72%;line-height:1}
.po-h small{color:var(--k-ink-2);font-size:12.5px;display:block}
.po-h .tm{margin-left:auto;font-family:var(--f-mono);font-size:18px}
.po-h .tm.watch{color:var(--k-watch)}
.po-h .tm.late{color:#FF7A6E}
.po-r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 14px;border-bottom:1px solid var(--k-line);align-items:center}
.po-r:last-of-type{border-bottom:0}
.po-r .s{font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center}
.po-r .s em{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--k-ink-2);border:1px solid var(--k-line);padding:0 5px;border-radius:3px}
.po-r .it{font-size:13px;color:var(--k-ink-2);grid-column:1}
.kst{height:26px;padding:0 9px;border-radius:5px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;letter-spacing:.02em}
.kst.placed{background:#262A32;color:#C9CDD5}
.kst.preparing{background:rgba(240,164,23,.16);color:#F4B848}
.kst.ready{background:rgba(30,155,92,.2);color:#5FD39A}
.kst.served{background:transparent;color:#6B717C}
.po-r .act{display:flex;gap:6px;grid-row:1/3;grid-column:2}
.kmini{height:36px;padding:0 12px;border-radius:7px;font-weight:700;font-size:13px;background:var(--k-paper);color:var(--k-paper-ink)}
.kmini.go{background:var(--k-ready);color:#fff}
.po-f{padding:10px 14px;background:#1A1D23;display:flex;gap:10px;align-items:center}
.po-f .kgo{height:44px;font-size:15px}
@media (max-width:900px){.kside{position:fixed;right:0;top:0;bottom:0;z-index:30;width:min(320px,90%)}}

.rcpt .r.big{font-weight:700;font-size:13.5px;margin-top:4px}
.rcpt hr{border:0;border-top:1px dashed #9A9A94;margin:10px 0}
@media (max-width:1100px){.settle{grid-template-columns:1fr;height:auto}.settle-pay{border-left:0;border-top:1px solid var(--line);padding-bottom:24px}.settle-bill{padding-bottom:24px}.till{height:auto;min-height:100%}}
@media (max-width:760px){.till{grid-template-columns:1fr}.till.sel .till-list{display:none}.till:not(.sel) .till-empty{display:none}.till-back{display:inline-flex}.till-list{border-right:0;padding-bottom:24px}}


/* ---------- reports ---------- */
.rep{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%;align-items:start}
.rep-nav{position:sticky;top:0;max-height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--surface);padding:10px 8px 40px;align-self:stretch}
.rep-nav button{display:block;width:100%;text-align:left;padding:7px 12px;border-radius:7px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.rep-nav button:hover{background:var(--surface-2);color:var(--ink)}
.rep-nav button.on{background:var(--surface-3);color:var(--ink);font-weight:600}
.rep-select{display:none}
.sorth{font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;white-space:nowrap}
.sorth:hover{color:var(--ink)}
table.t.rt td:first-child{white-space:nowrap}
table.t tr.tot-row td{background:var(--surface-2);border-top:1px solid var(--line-2)}
@media (max-width:1000px){.rep{grid-template-columns:1fr}.rep-nav{display:none}.rep-select{display:block;max-width:360px}}


/* ---------- device setup ---------- */
.setup{max-width:520px;display:grid;gap:18px;padding-top:6px}
.steps2{display:flex;gap:18px;font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--ink-3)}
.steps2 .on{color:var(--ink)}
.steps2 .done{color:var(--ok)}
.setup-card{display:grid;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.setup-card h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em;font-stretch:92%}
.setup-card>p{margin:-8px 0 0;font-size:14px}
.si-device{display:inline-flex;align-items:center;gap:7px;margin-top:10px;padding:6px 10px;border-radius:7px;background:rgba(255,255,255,.07);color:#C9CED6;font-size:13px;font-weight:600;justify-self:start;align-self:flex-start;position:relative;z-index:1}
.linkbtn{color:var(--accent-ink);font-weight:600;text-decoration:underline;text-underline-offset:2px}

.inv-me small{display:block}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--ink)}
.check small{display:block;color:var(--ink-3);font-size:12.5px}
.form-err{padding:10px 12px;border-radius:9px;background:var(--bad-soft);color:var(--bad);font-size:13.5px;font-weight:500}
.demo-acc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;padding-top:4px;border-top:1px dashed var(--line)}
.walkup .setup-card{border:0;padding:0;background:none}
.walkup .setup-card h1,.walkup .setup-card>p{display:none}

function attendance(S,p,d,now){
  const sh=S.roster[p.id]&&S.roster[p.id][d];if(!sh)return null;
  const ws=weekStart(now),today=dayIdx(now);
  const start=ws+d*DAY+tmin(sh.start)*MIN;
  const off=((hash(p.id+d)%23)-8);
  if(d>today)return null;
  if(now<start)return {cls:'mut',text:'Starts '+sh.start};
  if(p.id==='c-adeel'&&d===today)return {cls:'bad',text:'No clock-in'};
  const inn=hhmm(tmin(sh.start)+off);
  return {cls:off>5?'warn':'ok',text:'In '+inn+(off>5?' · '+off+' min late':'')+(d<today?' · out '+hhmm(tmin(sh.end)+(hash(p.id+'o'+d)%12)):'')};
}
function approvalItems(S){

  for(const p of S.store.prs)if(p.status==='pending')out.push({key:'p'+p.id,kind:'purchase',at:p.at,p,venue:'F&B Store',title:'Purchase request '+p.id,sub:VEND[p.vendor].name+' · '+p.lines.length+' items',amount:prValue(p),byName:p.by});

  return out.sort((x,y)=>x.at-y.at);
}
function salesToday(S,now){
  const h=new Date(now).getHours()+new Date(now).getMinutes()/60;
  const rows=VEN_LIST.map(v=>{const b=SALES_BASE[v];const frac=Math.max(.15,Math.min(1,(h-b.open)/(b.close-b.open)));
    const live=S.orders.filter(o=>o.venue===v&&o.openedAt>=startOfDay(now));
    const lt=live.map(orderTotals);
    const gross=b.gross*frac+lt.reduce((a,x)=>a+x.sub,0);const disc=b.disc*frac+lt.reduce((a,x)=>a+x.disc+x.xdisc,0);
    const voids=b.voids+live.flatMap(o=>o.lines).filter(l=>l.state==='void').reduce((a,l)=>a+l.unit*l.qty,0);
    const orders=Math.round(b.orders*frac)+live.length,covers=Math.round(b.covers*frac)+live.reduce((a,o)=>a+o.covers,0);
    const net=gross-disc;return {v,gross,disc,voids,net,tax:net*(S.pos.taxPct/100),orders,covers,avg:covers?net/covers:0,mix:b.mix,open:live.filter(o=>!o.closedAt).length}});
  const tot=rows.reduce((a,r)=>({gross:a.gross+r.gross,disc:a.disc+r.disc,voids:a.voids+r.voids,net:a.net+r.net,tax:a.tax+r.tax,orders:a.orders+r.orders,covers:a.covers+r.covers}),{gross:0,disc:0,voids:0,net:0,tax:0,orders:0,covers:0});
  const mix=[0,1,2].map(i=>rows.reduce((a,r)=>a+r.net*r.mix[i],0)+(S.payments||[]).filter(p=>p.orderId&&p.at>=startOfDay(now)&&p.tender===['cash','card','bank'][i]).reduce((a,p)=>a+p.amount,0));
  const hours=[];for(let hr=8;hr<=Math.min(23,Math.floor(h));hr++){let v=0;rows.forEach(r=>{const b=SALES_BASE[r.v];if(hr<b.open||hr>=b.close)return;const peak=Math.exp(-((hr-13)**2)/3)*.8+Math.exp(-((hr-20.5)**2)/4)+.15;v+=r.net*peak/5.2});hours.push({hr,v})}
  return {rows,tot,mix,hours};
}
function foodCost(S,v){
  const items=MENU.filter(m=>m.venue===v).map(m=>liveItem(S,m));
  const rev=items.reduce((a,m)=>a+weekSold(m)*m.price,0),theo=items.reduce((a,m)=>a+weekSold(m)*recipeCost(m),0);
  const loc=VENUES[v].location,now=Date.now();
  const waste=S.inv[loc].waste.filter(w=>w.at>now-7*DAY).reduce((a,w)=>a+w.cost,0);
  const variance=Math.max(0,-((S.inv[loc].counts[0]||{}).variance||0));
  const actual=theo+waste+variance;return {rev,theo,waste,variance,actual,pct:actual/rev*100,theoPct:theo/rev*100,target:S.targets[v]};
}

function HourChart({hours,label}){
  if(!hours.length)return html`<div class="empty"><b>No sales yet today</b>The first venue opens at 08:00.</div>`;
  const max=Math.max(...hours.map(h=>h.v))*1.15||1;const n=hours.length;const bw=Math.min(30,(512-(n-1)*6)/n),gap=n>1?(512-n*bw)/(n-1):0;
  return html`<div class="chart"><svg viewBox="0 0 560 200" role="img" aria-label=${label}>
    ${[0,.5,1].map((f,i)=>{const y=170-f*150;const v=max*f;return html`<g key=${i}><line x1="44" x2="556" y1=${y} y2=${y} stroke="var(--line)" stroke-dasharray=${f?'3 4':''}/><text x="38" y=${y+4} text-anchor="end">${v>=1000?Math.round(v/1000)+'k':Math.round(v)}</text></g>`})}
    ${hours.map((x,i)=>{const xx=48+i*(bw+gap),hh=x.v/max*150,last=i===n-1;return html`<g key=${x.hr}><rect x=${xx} y=${170-hh} width=${bw} height=${hh} rx="3" fill=${last?'var(--accent)':'var(--line-2)'}/>${(i%2===0||last)?html`<text x=${xx+bw/2} y="190" text-anchor="middle" style=${last?{fill:'var(--ink)',fontWeight:600}:null}>${String(x.hr).padStart(2,'0')}:00</text>`:null}</g>`})}
  </svg></div>`;
}

function ApprovalSheet({item,me,onClose}){
  const [note,setNote]=useState('');
  const [qty,setQty]=useState(()=>item&&item.kind==='kitchen'?Object.fromEntries(item.r.lines.map(l=>[l.ing,Math.min(l.req,STATE.store.stock[l.ing]?STATE.store.stock[l.ing].onHand:l.req)])):{});
  if(!item)return null;
  const decide=ok=>{
    const t=Date.now();
    update(S=>{
      if(item.kind==='kitchen'){const R=S.inv[item.loc].requests.find(r=>r.id===item.r.id);
        if(ok){R.status='approved';R.lines.forEach(l=>{l.app=+qty[l.ing]});const trimmed=R.lines.filter(l=>l.app<l.req);R.log.push({s:'approved',at:t,by:me.name,note:note||(trimmed.length?trimmed.map(l=>ING[l.ing].name+' trimmed to '+fmtQU(l.app,ING[l.ing].unit)).join('; '):'')})}
        else{R.status='rejected';R.log.push({s:'rejected',at:t,by:me.name,note:'Rejected: '+note})}}
      else if(item.kind==='purchase'){const P=S.store.prs.find(p=>p.id===item.p.id);P.decidedAt=t;
        if(ok){const id='PO-'+(++S.poSeq);P.status='approved';P.po=id;S.store.pos.unshift({id,vendor:P.vendor,status:'approved',at:t,due:startOfDay(t)+DAY+9*HOUR,from:P.id,by:P.by,approvedBy:me.name,lines:P.lines.map(l=>({...l}))})}
        else{P.status='rejected';P.note=note}}
      else{const A=S.approvals.find(a=>a.id===item.a.id);A.status=ok?'approved':'rejected';A.decidedAt=t;A.decidedBy=me.name;
        if(A.kind==='discount'&&A.orderId){const o=S.orders.find(x=>x.id===A.orderId);if(o){o.xdiscPending=null;if(ok)o.xdisc={...A.xdisc,by:me.name}}}
        if(A.kind==='void-item'&&!ok){const o=S.orders.find(x=>x.id===A.orderId);const l=o&&o.lines.find(x=>x.id===A.lineId);if(l){l.state='sent';const tk=S.tickets.find(k=>k.id===l.ticket);if(tk){const tl=tk.lines.find(x=>x.lid===l.id);if(tl)tl.void=false;if(tk.status==='served'&&tk.lines.some(x=>!x.void))tk.status='preparing';tk.slips.push({kind:'moved',text:'VOID REJECTED · continue '+l.qty+'× '+l.name,at:t})}}}}
    });
    toast(ok?(item.kind==='purchase'?'Approved. Purchase order raised for '+VEND[item.p.vendor].name+'.':item.kind==='kitchen'?'Approved. The F&B Store can dispatch '+item.r.id+' now.':'Approved.'):'Rejected. '+item.byName+' has been told.');onClose();
  };
  const foot=html`<button class="btn danger" disabled=${!note.trim()} title=${note.trim()?'':'Add a reason to reject'} onClick=${()=>decide(false)}>Reject</button><span style=${{flex:1}}></span><button class="btn primary" onClick=${()=>decide(true)}><${Icon} n="check"/>Approve</button>`;
  return html`<${Drawer} title=${item.title} sub=${KIND_LBL[item.kind]+' · '+item.venue+' · from '+item.byName+' · '+ago(item.at,Date.now())} onClose=${onClose} foot=${foot}>
    ${item.kind==='kitchen'?html`<div class="tbl-wrap" style=${{border:'1px solid var(--line)',borderRadius:10}}><table class="t"><thead><tr><th>Ingredient</th><th class="r">Asked</th><th class="r">In store</th><th class="r">Approve</th></tr></thead>
      <tbody>${item.r.lines.map(l=>{const i=ING[l.ing];const st=STATE.store.stock[l.ing];return html`<tr key=${l.ing}><td class="nm"><b>${i.name}</b><small>${fmtRs(i.cost)} per ${i.unit}</small></td><td class="r">${fmtQU(l.req,i.unit)}</td><td class=${'r'+(st&&st.onHand<l.req?'':' muted')} style=${st&&st.onHand<l.req?{color:'var(--warn)',fontWeight:600}:null}>${st?fmtQ(st.onHand):'—'}</td>
        <td class="r"><input id=${'ap-'+l.ing} class="input q-in" type="number" min="0" step=${i.pack} value=${qty[l.ing]} onInput=${e=>setQty(o=>({...o,[l.ing]:Math.max(0,+e.target.value||0)}))}/></td></tr>`})}</tbody></table></div>
      <small class="muted">Quantities default to what the store holds. Trim a line and the venue sees why on their request.</small>`
    :item.kind==='purchase'?html`<dl class="dl"><dt>Vendor</dt><dd>${VEND[item.p.vendor].name} · pays in ${VEND[item.p.vendor].terms} days</dd><dt>Raised by</dt><dd>${item.p.by}</dd>${item.p.note?html`<dt>Note</dt><dd>${item.p.note}</dd>`:null}</dl>

      <tbody>${item.p.lines.map(l=>{const i=ING[l.ing];return html`<tr key=${l.ing}><td><b>${i.name}</b></td><td class="r muted">${fmtQ(STATE.store.stock[l.ing].onHand)}</td><td class="r">${fmtQU(l.qty,i.unit)}</td><td class="r">${fmtRs(l.price)}</td><td class="r">${fmtRs(l.qty*l.price)}</td></tr>`})}</tbody></table></div>

  <//>`;

function MgrCosting({S}){

  const totalSold=items.reduce((a,m)=>a+m.sold,0);const popT=totalSold/items.length*.7;const avgM=items.reduce((a,m)=>a+m.margin*m.sold,0)/totalSold;

function PickDrawer({S,me,pick,onClose}){
  const r=S.inv[pick.loc].requests.find(x=>x.id===pick.id);

    R.log.push({s:'dispatched',at:t,by:me.name,note:short.length?short.map(l=>ING[l.ing].name+' short by '+fmtQU(l.app-q[l.ing],ING[l.ing].unit)).join('; '):''})});

    <div class="tbl-wrap" style=${{border:'1px solid var(--line)',borderRadius:10}}><table class="t"><thead><tr><th style=${{width:40}}></th><th>Ingredient</th><th class="r">Approved</th><th class="r">In store</th><th class="r">Send</th></tr></thead>
      <tbody>${r.lines.map(l=>{const i=ING[l.ing],st=S.store.stock[l.ing];return html`<tr key=${l.ing} class="click" onClick=${()=>setTicked(t=>({...t,[l.ing]:!t[l.ing]}))}>
        <td><span class=${'cbx'+(ticked[l.ing]?' on':'')}>${ticked[l.ing]?html`<${Icon} n="check"/>`:null}</span></td><td class="nm"><b>${i.name}</b><small>${i.area} · batch ${st.batch}</small></td><td class="r">${fmtQU(l.app,i.unit)}</td>
        <td class="r" style=${st.onHand<l.app?{color:'var(--bad)',fontWeight:600}:null}>${fmtQ(st.onHand)}</td>
        <td class="r" onClick=${e=>e.stopPropagation()}><input id=${'pk-'+l.ing} class="input q-in" type="number" min="0" max=${st.onHand} step=${i.pack} value=${q[l.ing]} onInput=${e=>setQ(o=>({...o,[l.ing]:Math.max(0,Math.min(st.onHand,+e.target.value||0))}))}/></td></tr>`})}</tbody></table></div>
    ${short.length?html`<div class="pill warn" style=${{height:'auto',padding:'8px 10px',whiteSpace:'normal',fontWeight:500}}>${short.length} line${short.length>1?'s':''} short. The venue and the F&B Manager see the shortfall on the request.</div>`:null}
    <small class="muted">Tick each line as it goes on the trolley. The store can't send more than it holds.</small>
  <//>`;

function ReceiveDrawer({S,me,id,onClose}){

function StoreStock({S,now}){

  const rows=Object.entries(S.store.stock).filter(([id,s])=>(!q||ING[id].name.toLowerCase().includes(q.toLowerCase()))&&(!low||s.onHand<s.reorder)).sort((a,b)=>AREAS_ORDER.indexOf(ING[a[0]].area)-AREAS_ORDER.indexOf(ING[b[0]].area)||ING[a[0]].name.localeCompare(ING[b[0]].name));
  return html`<div class="page">
    <div class="page-h"><div><h1>Store stock</h1><div class="sub">Levels are set by the F&B Manager. Cost is the weighted average of what was received.</div></div></div>
    <div class="toolbar"><div class="search"><${Icon} n="search"/><input id="store-q" class="input" placeholder="Search ingredients" value=${q} onInput=${e=>setQ(e.target.value)}/></div><button class=${'chip'+(low?' on':'')} onClick=${()=>setLow(!low)}><${Icon} n="alert" s=${14}/>Below reorder</button></div>
    <section class="panel"><div class="tbl-wrap" style=${{borderTop:0}}><table class="t"><thead><tr><th>Ingredient</th><th class="r">On hand</th><th class="r">Reorder</th><th class="r">Par</th><th>Level</th><th class="r">Avg cost</th><th class="r">Value</th><th>Batch · use by</th></tr></thead>
      <tbody>${rows.map(([id,s])=>{const i=ING[id];const exp=s.expiry-now;return html`<tr key=${id}><td class="nm"><b>${i.name}</b><small>${i.area} · ${vendorOf(id).name}</small></td><td class="r"><b>${fmtQ(s.onHand)}</b> <span class="muted">${i.unit}</span></td><td class="r muted">${fmtQ(s.reorder)}</td><td class="r muted">${fmtQ(s.par)}</td><td><${Level} s=${s}/></td><td class="r">${fmtRs(s.cost)}</td><td class="r">${fmtRs(s.onHand*s.cost)}</td>
        <td><span class="mono muted">${s.batch}</span> ${exp<2*DAY?html`<span class=${'pill '+(exp<DAY?'bad':'warn')}>${dayName(s.expiry)}</span>`:html`<span class="muted" style=${{fontSize:13}}>${dayName(s.expiry)}</span>`}</td></tr>`})}</tbody></table></div></section>
  </div>`;
}


/* ================= CASHIER ================= */
const CASHIER={'Rooftop':'k-nimra','Indoor Cafe':'k-fahad','Bar':'k-saad'};
const TENDERS=[['cash','Cash','tray'],['card','Card','receipt'],['bank','Bank transfer','arrow']];
const TENDER_LBL={cash:'Cash',card:'Card',bank:'Bank transfer'};
const DENOMS=[5000,1000,500,100,50,20,10];
const DISC_REASONS=['Long wait','Guest complaint','Regular guest','Management guest','Event booking'];
const paidOf=o=>(o.payments||[]).reduce((a,p)=>a+p.amount,0);
function seedCashier(S,t){
  S.payments=[];S.registers={};S.registerCloses=[];
  for(const v of VEN_LIST){
    S.registers[v]={float:10000,openedAt:t-5*HOUR};
    const tb=TABLES[v];
    for(let i=0;i<8;i++)S.payments.push({id:uid(),venue:v,table:tb[(i*3)%tb.length].id,orderId:null,tender:['card','cash','card','bank','card','cash','card','card'][i],amount:Math.round((1800+hash(v+i)%7000)/10)*10,at:t-4.5*HOUR+i*30*MIN,by:CASHIER[v],ref:''});
  }
  const y=startOfDay(t)-DAY+23*HOUR;
  S.registerCloses.push({id:uid(),venue:'Indoor Cafe',at:y-HOUR,by:'Fahad Iqbal',float:10000,cash:38300,card:121400,bank:16800,expected:48300,counted:48100,variance:-200,note:'Rs 200 short. Probably change given on a Rs 5,000 note.'},
    {id:uid(),venue:'Rooftop',at:y+30*MIN,by:'Nimra Shah',float:10000,cash:24650,card:142300,bank:9400,expected:34650,counted:34650,variance:0,note:''},
    {id:uid(),venue:'Bar',at:y+45*MIN,by:'Saad Rehman',float:10000,cash:11200,card:15800,bank:0,expected:21200,counted:21250,variance:50,note:''});
}
function CashierApp({me,signOut}){
  const S=useStore();const now=useNow(1000);
  const venue=me.venue;
  const [tab,setTab]=useState('bills');const [sel,setSel]=useState(null);const [receipt,setReceipt]=useState(null);
  useEffect(()=>{const beat=()=>update(s=>{s.occupied=s.occupied||{};s.occupied['cash:'+venue]=Date.now()});beat();const i=setInterval(beat,5000);return()=>clearInterval(i)},[]);
  const open=S.orders.filter(o=>o.venue===venue&&!o.closedAt);
  const waiting=open.filter(o=>o.billAt).sort((a,b)=>a.billAt-b.billAt);
  const eating=open.filter(o=>!o.billAt&&o.lines.some(l=>l.state!=='new')).sort((a,b)=>a.openedAt-b.openedAt);
  const order=sel&&S.orders.find(o=>o.id===sel&&!o.closedAt);
  const seen=useRef(null);
  useEffect(()=>{const ids=new Set(waiting.map(o=>o.id));if(seen.current)for(const o of waiting)if(!seen.current.has(o.id))toast(html`<span><b>${o.table}</b> bill printed by ${first(who(o.waiter).name)} · ${fmtRs(orderTotals(o).total)}</span>`,{action:{label:'Open',fn:()=>{setTab('bills');setSel(o.id)}}});seen.current=ids},[waiting.map(o=>o.id).join()]);
  const nav=[['bills','Bills','receipt'],['payments','Payments','list'],['close','Close register','clip']];
  return html`<div class="wt">
    <header class="wt-top">
      <div class="wt-brand">R</div>
      <div class="wt-venue"><b>${venue} till</b><small>${service(now)} · ${waiting.length} bill${waiting.length===1?'':'s'} waiting</small></div>
      <div class="sp"></div>
      <span class="wt-clock">${clock(now)}</span>
      <button class="me" onClick=${signOut} title="Sign out"><span class="mono-av av-cash">${initials(me.name)}</span><span>${first(me.name)}</span><${Icon} n="out"/></button>
    </header>
    <nav class="wt-rail" aria-label="Till">${nav.map(([id,l,ic])=>html`<button key=${id} class=${'rail-btn'+(tab===id?' on':'')} onClick=${()=>setTab(id)}><${Icon} n=${ic}/>${l}${id==='bills'&&waiting.length?html`<span class="badge">${waiting.length}</span>`:null}</button>`)}</nav>
    <main class="wt-main">
      ${tab==='bills'?html`<div class=${'till'+(order?' sel':'')}>
        <aside class="till-list" aria-label="Bills">
          <div class="eyebrow" style=${{padding:'4px 2px'}}>Waiting to pay · ${waiting.length}</div>
          ${waiting.length?waiting.map(o=>html`<${BillCard} key=${o.id} o=${o} now=${now} on=${sel===o.id} onClick=${()=>setSel(o.id)}/>`):html`<p class="muted" style=${{margin:'4px 2px 8px',fontSize:13}}>No printed bills. They appear here when a waiter prints one.</p>`}
          <div class="eyebrow" style=${{padding:'12px 2px 4px'}}>Still dining · ${eating.length}</div>
          ${eating.map(o=>html`<${BillCard} key=${o.id} o=${o} now=${now} on=${sel===o.id} onClick=${()=>setSel(o.id)} dim/>`)}
        </aside>
        ${order?html`<${Settle} key=${order.id} S=${S} me=${me} o=${order} now=${now} onBack=${()=>setSel(null)} onClosed=${id=>{setSel(null);setReceipt(id)}}/>`
          :html`<div class="till-empty"><div class="empty"><b>Pick a bill to settle</b>Printed bills are at the top, oldest first. You can also settle a table that's still dining if the guests ask to pay.</div></div>`}
      </div>`
      :tab==='payments'?html`<${CashPayments} S=${S} me=${me} now=${now}/>`
      :html`<${CloseRegister} S=${S} me=${me} now=${now}/>`}
    </main>
    ${receipt&&html`<${Receipt} S=${S} id=${receipt} me=${me} onClose=${()=>setReceipt(null)}/>`}
  </div>`;
}
function BillCard({o,now,on,onClick,dim}){
  const t=orderTotals(o);const w=o.billAt?now-o.billAt:0;
  return html`<button class=${'bill-card'+(on?' on':'')} onClick=${onClick}>
    <div class="top"><span class="tno">${o.table}</span><span class="muted" style=${{fontSize:12.5}}>${o.covers} cov · ${first(who(o.waiter).name)}</span><span class="amt">${fmtRs(t.total-paidOf(o))}</span></div>
    <div style=${{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}}>
      ${o.guest.type==='Member'?html`<span class="pill accent">Member</span>`:o.guest.type==='Staff meal'?html`<span class="pill">Staff meal</span>`:null}
      ${o.xdiscPending?html`<span class="pill warn">Discount awaiting approval</span>`:null}
      ${paidOf(o)?html`<span class="pill ok">Part paid</span>`:null}
      ${dim?html`<span class="muted" style=${{fontSize:12.5}}>Dining ${mins(now-o.openedAt)} min</span>`:html`<span class=${'wait '+(w>8*MIN?'bad':w>4*MIN?'warn':'')}>Waiting ${mmss(w)}</span>`}
    </div></button>`;
}

        <div style=${{display:'flex',gap:6,flexWrap:'wrap',paddingBottom:4}}><span class="pill"><${Icon} n="users" s=${13}/>${o.covers}</span><span class=${'pill'+(o.guest.type==='Member'?' accent':'')}>${o.guest.type==='Member'?o.guest.name+' · '+o.guest.no:o.guest.type==='Staff meal'?'Staff meal · '+o.guest.dept:'Walk-in'}</span><span class="pill">${who(o.waiter).name}</span>${o.billAt?html`<span class="pill">Bill printed ${clock(o.billAt)}</span>`:html`<span class="pill warn">Bill not printed</span>`}</div></div>

      <div class="tot" style=${{maxWidth:420,marginLeft:'auto',marginTop:14}}>

        ${t.disc?html`<div><span>${o.guest.type==='Member'?'Member discount '+STATE.pos.memberPct+'%':'Staff meal'}</span><span>−${fmtRs(t.disc)}</span></div>`:null}

function DiscountSheet({o,me,onClose}){
  const t0=orderTotals({...o,xdisc:null});const base=t0.sub-t0.disc;
  const [type,setType]=useState(o.xdisc?o.xdisc.type:'pct');const [val,setVal]=useState(o.xdisc?String(o.xdisc.value):'');const [reason,setReason]=useState(o.xdisc?o.xdisc.reason:'');
  const v=Math.max(0,+val||0);const amount=type==='pct'?Math.round(base*Math.min(v,100)/100):Math.min(v,base);const pct=base?amount/base*100:0;
  const limit=STATE.pos.discLimit;const over=pct>limit+1e-9;
  const ok=v>0&&reason.trim();
  const apply=()=>{update(s=>{const x=s.orders.find(y=>y.id===o.id);x.xdisc={type,value:v,reason:reason.trim(),by:null}});toast('Discount of '+fmtRs(amount)+' applied.');onClose()};
  const ask=()=>{update(s=>{const id=uid();const x=s.orders.find(y=>y.id===o.id);x.xdiscPending=id;s.approvals.push({id,kind:'discount',venue:o.venue,title:(type==='pct'?v+'%':fmtRs(v))+' checkout discount on '+o.table,detail:reason.trim()+'. The cashier limit is '+limit+'%.',by:me.id,at:Date.now(),amount,status:'pending',orderId:o.id,xdisc:{type,value:v,reason:reason.trim()}})});toast('Sent to '+FNB_MANAGER+'. You can take other bills while you wait.');onClose()};
  const remove=()=>{update(s=>{const x=s.orders.find(y=>y.id===o.id);x.xdisc=null});toast('Discount removed.');onClose()};
  return html`<${Sheet} title=${'Discount on '+o.table} sub=${'You can give up to '+limit+'% yourself. Anything above goes to the F&B Manager.'} onClose=${onClose}
    foot=${html`${o.xdisc?html`<button class="btn danger" onClick=${remove}>Remove discount</button>`:null}<span style=${{flex:1}}></span>${over?html`<button class="btn primary" disabled=${!ok} onClick=${ask}>Ask ${FNB_MANAGER.split(' ')[0]} to approve</button>`:html`<button class="btn primary" disabled=${!ok} onClick=${apply}>Apply · −${fmtRs(amount)}</button>`}`}>
    <div class="seg" style=${{justifySelf:'start'}}><button class=${type==='pct'?'on':''} onClick=${()=>setType('pct')}>Percent</button><button class=${type==='amt'?'on':''} onClick=${()=>setType('amt')}>Amount</button></div>
    <label class="field"><span>${type==='pct'?'Percent off':'Rupees off'}</span><input id="disc-val" class="input amt-in" type="number" min="0" value=${val} placeholder=${type==='pct'?'10':'500'} onInput=${e=>setVal(e.target.value)}/></label>
    ${v>0?html`<div class=${'change'+(over?' short':'')}><span>${over?pct.toFixed(0)+'% is above your '+limit+'% limit':'Comes off the bill'}</span><b>−${fmtRs(amount)}</b></div>`:null}
    <div class="field"><span>Reason · needed</span><div class="reason-chips">${DISC_REASONS.map(r=>html`<button key=${r} class=${'chip'+(reason===r?' on':'')} onClick=${()=>setReason(r)}>${r}</button>`)}</div>
      <input id="disc-reason" class="input" placeholder="Or type the reason" value=${reason} onInput=${e=>setReason(e.target.value)}/></div>
    <small class="muted">Applied after the member discount and before tax. It shows on the receipt and in the F&B Manager's sales report.</small>
  <//>`;
}

function exceptionsList(S,now){
  const out=[];const H=purchaseHistory(S);
  for(const c of S.registerCloses)if(Math.abs(c.variance)>=100)out.push({sev:'bad',area:'Cash',at:c.at,title:c.venue+' register '+(c.variance<0?fmtRs(-c.variance)+' short':fmtRs(c.variance)+' over'),detail:c.by+(c.note?' · '+c.note:'')});
  for(const b of S.store.bills){const g=S.store.grns.find(x=>x.id===b.grn);if(g&&b.status==='to_match'&&b.amount-grnValue(g)>=1)out.push({sev:'bad',area:'Purchasing',at:b.at,title:'Invoice '+b.inv+' is '+fmtRs(b.amount-grnValue(g))+' above what arrived',detail:VEND[b.vendor].name+' · '+b.po})}
  for(const a of S.approvals)if(['void-item','discount','void','refund'].includes(a.kind))out.push({sev:a.status==='rejected'?'warn':'warn',area:'Till',at:a.at,title:a.title,detail:who(a.by).name+' · '+(a.status==='pending'?'awaiting approval':a.status)});
  for(const [loc,I] of Object.entries(S.inv))for(const r of I.requests)if(r.status==='received'){const s=r.lines.filter(l=>l.rec!=null&&l.dis!=null&&l.rec<l.dis-1e-9);if(s.length)out.push({sev:'warn',area:'Transfers',at:r.log[r.log.length-1].at,title:r.id+' arrived short at '+loc,detail:s.map(l=>ING[l.ing].name+' −'+fmtQU(l.dis-l.rec,ING[l.ing].unit)+(l.why?' ('+l.why+')':'')).join(', ')})}
  const byIng=groupBy(H.orders.slice().sort((a,b)=>a.at-b.at),o=>o.ing);
  for(const [ing,list] of byIng){if(list.length<2)continue;const a=list[list.length-2],b=list[list.length-1];const ch=(b.price-a.price)/a.price*100;if(ch>=4&&b.w<=1)out.push({sev:'warn',area:'Prices',at:b.at,title:ING[ing].name+' up '+ch.toFixed(0)+'% at '+VEND[b.vendor].name,detail:fmtRs(a.price)+' → '+fmtRs(b.price)+' per '+ING[ing].unit})}

  return out.sort((a,b)=>(a.sev==='bad'?0:1)-(b.sev==='bad'?0:1)||b.at-a.at);
}

// Create station tickets for unsent, unheld lines (one KOT per station). Deducts ingredients from the venue kitchen.
function fire(S,order,at,quiet){
  const pending=order.lines.filter(l=>l.state==='new'&&!l.held);
  if(!pending.length)return [];
  const hadTickets=S.tickets.some(k=>k.orderId===order.id);
  const by={};pending.forEach(l=>{(by[l.station]=by[l.station]||[]).push(l)});
  const made=[];
  for(const [station,lines] of Object.entries(by)){
    const tk={id:uid(),no:'KOT-'+(++S.kotSeq),orderId:order.id,venue:order.venue,station,table:order.table,covers:order.covers,waiter:order.waiter,
      kind:hadTickets?'additional':'new',createdAt:at,status:'placed',acceptedAt:null,readyAt:null,servedAt:null,struck:{},slips:[],
      lines:lines.map(l=>({lid:l.id,qty:l.qty,name:l.name,mods:l.mods,note:l.note,seat:l.seat,void:false}))};
    lines.forEach(l=>{l.state='sent';l.ticket=tk.id});
    S.tickets.push(tk);made.push(tk);
  }
  // stock consumption at the venue kitchen
  const loc=VENUES[order.venue].location, inv=S.inv[loc];
  const used={};
  pending.forEach(l=>{const r=MI[l.item].recipe;for(const [ing,q] of Object.entries(r))used[ing]=(used[ing]||0)+q*l.qty});
  for(const [ing,q] of Object.entries(used)){if(inv.stock[ing]){inv.stock[ing].onHand=Math.max(0,+(inv.stock[ing].onHand-q).toFixed(3));if(!quiet)inv.moves.push({id:uid(),ing,qty:-q,kind:'sales',ref:order.table+' · '+made.map(m=>m.no).join(', '),at,by:who(order.waiter).name})}}
  if(inv.moves.length>260)inv.moves.splice(0,inv.moves.length-260);
  return made;
}

const orderTotals=o=>{
  const live=o.lines.filter(l=>l.state!=='void');
  const sub=live.reduce((a,l)=>a+l.unit*l.qty,0);
  const g=o.guest||{};
  const disc=g.type==='Member'?Math.round(sub*STATE.pos.memberPct/100):g.type==='Staff meal'?sub:0;
  const xd=o.xdisc?(o.xdisc.type==='pct'?Math.round((sub-disc)*Math.min(100,o.xdisc.value)/100):Math.min(o.xdisc.value,sub-disc)):0;
  const tax=g.type==='Staff meal'?0:Math.round((sub-disc-xd)*STATE.pos.taxPct/100);
  return {sub,disc,xdisc:xd,tax,total:sub-disc-xd+tax,count:live.reduce((a,l)=>a+l.qty,0)};
};
const orderTickets=(S,o)=>S.tickets.filter(k=>k.orderId===o.id);
function tableState(S,venue,tableId){
  const o=S.orders.find(x=>x.venue===venue&&x.table===tableId&&!x.closedAt);
  if(!o)return {state:'free'};
  const tks=orderTickets(S,o);
  const ready=tks.some(k=>k.status==='ready');
  const late=tks.some(k=>(k.status==='placed'||k.status==='preparing')&&Date.now()-k.createdAt>12*MIN);
  if(o.billAt)return {state:'bill',o,late:false};
  if(ready)return {state:'ready',o,late};
  return {state:'seated',o,late};
}
function availability(S,item){
  const loc=VENUES[item.venue].location, st=S.inv[loc].stock;let n=Infinity;
  for(const [ing,q] of Object.entries(item.recipe)){if(!st[ing])continue;n=Math.min(n,Math.floor(st[ing].onHand/q+1e-9))}
  return n;
}

/* simulation: keeps the venue alive and lets a single tester see food come back */
function simTick(me){
  if(!STATE.simulate)return;
  const now=Date.now();
  if(now-(STATE.lastSim||0)<3500)return;
  update(S=>{
    S.lastSim=now;
    const occ=id=>S.occupied[id]&&now-S.occupied[id]<15000;
    for(const tk of S.tickets){
      const station=ST[tk.station];
      const passHere=occ('pass:'+tk.venue)&&stMode(tk.station)==='paper';
      if(occ(tk.station)||passHere)continue;
      const h=hash(tk.id);
      // seeded tickets get a few minutes' grace so the first look at a station shows a realistic rail
      const floor=tk.seed?S.seededAt+(150+h%200)*1000:0;
      if(tk.status==='placed'&&now-Math.max(tk.createdAt,floor)>(20+h%30)*1000){tk.status='preparing';tk.acceptedAt=now}
      else if(tk.status==='preparing'&&now-Math.max(tk.acceptedAt||tk.createdAt,floor)>(60+h%110)*1000){tk.status='ready';tk.readyAt=now}
    }
    for(const o of S.orders){
      if(o.closedAt||!o.sim)continue;
      const tks=S.tickets.filter(k=>k.orderId===o.id);
      tks.forEach(k=>{if(k.status==='ready'&&now-k.readyAt>80000){k.status='served';k.servedAt=now}});
      if(tks.length&&tks.every(k=>k.status==='served')){
        const last=Math.max(...tks.map(k=>k.servedAt||0));
        if(!o.billAt&&now-last>4*MIN)o.billAt=now;
        else if(o.billAt&&now-o.billAt>3*MIN&&!occ('cash:'+o.venue)){const tt=orderTotals(o);const pay={id:uid(),venue:o.venue,table:o.table,orderId:o.id,tender:hash(o.id)%3===0?'cash':'card',amount:tt.total-paidOf(o),at:now,by:CASHIER[o.venue],ref:''};o.payments=[...(o.payments||[]),pay];S.payments.push(pay);o.closedAt=now;o.paidAt=now}
      }
    }
    S.orders=S.orders.filter(o=>!o.closedAt||now-o.closedAt<HOUR);
    // new walk-ins in the signed-in person's venue
    if(me&&me.venue){
      const v=me.venue;const due=S.nextSim[v]||(now+40000);
      if(!S.nextSim[v])S.nextSim[v]=due;
      if(now>=due){
        S.nextSim[v]=now+(70+Math.random()*50)*1000;
        const busy=new Set(S.orders.filter(o=>o.venue===v&&!o.closedAt).map(o=>o.table));
        const free=TABLES[v].filter(tb=>!busy.has(tb.id));
        if(free.length>2){
          const tb=free[Math.floor(Math.random()*free.length)];
          const menu=MENU.filter(m=>m.venue===v).map(m=>liveItem(S,m)).filter(m=>!m.off&&availability(S,m)>2);
          const n=1+Math.floor(Math.random()*3);const lines=[];
          for(let i=0;i<n;i++){const it=menu[Math.floor(Math.random()*menu.length)];const mods=it.mods.filter(g=>MODS[g].req).map(g=>MODS[g].opts[Math.floor(Math.random()*MODS[g].opts.length)][0]);
            lines.push({id:uid(),item:it.id,name:it.name,unit:lineUnit(it,mods),qty:1+Math.floor(Math.random()*2),mods,note:Math.random()<.18?NOTES[Math.floor(Math.random()*6)]:'',seat:0,held:false,state:'new',station:it.station})}
          const o={id:uid(),venue:v,table:tb.id,covers:Math.min(tb.seats,2+Math.floor(Math.random()*3)),waiter:BG_WAITER[v],openedAt:now-2*MIN,guest:{type:'Walk-in'},lines,billAt:null,sim:true};
          S.orders.push(o);fire(S,o,now,false);
        }
      }
    }
  });
}

function chairs(tb){
  const out=[];const n=tb.seats;
  if(tb.shape==='round'){for(let i=0;i<n;i++){const a=(i/n)*Math.PI*2-Math.PI/2;out.push([50+66*Math.cos(a),50+66*Math.sin(a)])}}
  else if(tb.shape==='long'){const per=n/2;for(let i=0;i<per;i++){const x=(i+.5)/per*100;out.push([x,-22]);out.push([x,122])}}
  else{if(n===2){out.push([-20,50],[120,50])}else{out.push([50,-20],[120,50],[50,120],[-20,50])}}
  return out;
}

function ItemSheet({item,covers,seat0,onClose,onAdd,initial}){
  const [mods,setMods]=useState(()=>initial?initial.mods:item.mods.filter(g=>MODS[g].req).map(()=>null).length?[]:[]);
  const [qty,setQty]=useState(1);const [note,setNote]=useState('');const [seat,setSeat]=useState(seat0);
  const groups=item.mods.map(g=>({g,...MODS[g]}));
  const toggle=(g,o)=>{const opts=MODS[g].opts.map(x=>x[0]);if(MODS[g].one)setMods(m=>[...m.filter(x=>!opts.includes(x)),o]);else setMods(m=>m.includes(o)?m.filter(x=>x!==o):[...m,o])};
  const missing=groups.filter(g=>g.req&&!g.opts.some(o=>mods.includes(o[0])));

function LineSheet({line,order,onClose}){

  const open=k=>k.status==='placed'||k.status==='preparing';

  useEffect(()=>{const ids=new Set(scopeTks.map(k=>k.id));if(seen.current){if(scopeTks.some(k=>!seen.current.has(k.id)&&k.status==='placed'))chime()}seen.current=ids},[scopeTks.map(k=>k.id).join()]);
  const oldest=scopeTks.length?Math.max(...scopeTks.map(k=>now-k.createdAt)):0;
  const lateN=scopeTks.filter(k=>now-k.createdAt>=12*MIN).length;
  const doneToday=S.tickets.filter(k=>(view==='pass'?k.venue===venue:k.station===view)&&k.readyAt);
  const avg=doneToday.length?doneToday.reduce((a,k)=>a+(k.readyAt-k.createdAt),0)/doneToday.length:0;
  const setStatus=(k,st)=>{
    update(s=>{const t=s.tickets.find(x=>x.id===k.id);if(!t)return;t.status=st;if(st==='preparing'){t.acceptedAt=t.acceptedAt||Date.now();t.readyAt=null}if(st==='ready')t.readyAt=Date.now();if(st==='served')t.servedAt=Date.now()});
    if(st==='ready'){setRecent(r=>[k.id,...r.filter(x=>x!==k.id)].slice(0,12));toast(html`<span><b>${k.table}</b> bumped · ${k.no}</span>`,{action:{label:'Undo',fn:()=>update(s=>{const t=s.tickets.find(x=>x.id===k.id);if(t&&t.status==='ready'){t.status='preparing';t.readyAt=null}})}})}
  };

  const title=view==='pass'?'The pass':ST[view].name;
  const recallList=S.tickets.filter(k=>(view==='pass'?k.venue===venue:k.station===view)&&(k.status==='ready'||k.status==='served')).sort((a,b)=>(b.readyAt||0)-(a.readyAt||0)).slice(0,10);
  return html`<div class="kds">
    <div>
      <header class="kds-top">
        <div class="kds-st"><b>${title}</b><small>${venue} · ${me.name}</small></div>
        <div class="kstat"><b>${scopeTks.length}</b><small>Open</small></div>
        <div class=${'kstat'+(lateN?' late':'')}><b>${lateN}</b><small>Late</small></div>
        <div class="kstat"><b>${scopeTks.length?mmss(oldest):'—'}</b><small>Oldest</small></div>
        <div class="kstat"><b>${avg?mmss(avg):'—'}</b><small>Avg ticket</small></div>
        <div class="sp"></div>
        <span class="kclock">${clock(now)}</span>
        <button class=${'kbtn'+(side==='allday'?' on':'')} onClick=${()=>setSide(side==='allday'?null:'allday')}><${Icon} n="layers"/>All day</button>
        <button class=${'kbtn'+(side==='recall'?' on':'')} onClick=${()=>setSide(side==='recall'?null:'recall')}><${Icon} n="undo"/>Recall</button>
        <button class="kbtn" onClick=${()=>update(s=>{s.sound=!s.sound})} aria-label=${S.sound?'Mute new-ticket chime':'Turn chime on'}><${Icon} n=${S.sound?'vol':'mute'}/></button>
        <button class="kbtn" onClick=${signOut} aria-label="Sign out"><${Icon} n="out"/></button>
      </header>
      ${isPass?html`<div class="ktabs" role="tablist">
        <button class=${'ktab'+(view==='pass'?' on':'')} onClick=${()=>setView('pass')}>All stations<span class="n">${new Set(S.tickets.filter(k=>k.venue===venue&&open(k)).map(k=>k.orderId)).size}</span></button>
        ${stations.map(st=>html`<button key=${st.id} class=${'ktab'+(view===st.id?' on':'')} onClick=${()=>setView(st.id)}>${st.name}${stMode(st.id)==='paper'?' · paper':''}<span class="n">${stationTks(st.id).length}</span></button>`)}
      </div>`:null}
    </div>
    <div class="kbody">
      ${view==='pass'?html`<${PassView} S=${S} venue=${venue} now=${now} setStatus=${setStatus}/>`
      :html`<div class="krail">${scopeTks.length?scopeTks.map(k=>html`<${Ticket} key=${k.id} k=${k} now=${now} onStart=${()=>setStatus(k,'preparing')} onReady=${()=>setStatus(k,'ready')} onStrike=${lid=>strike(k,lid)}/>`)
        :html`<div class="kempty"><b>All clear</b>New tickets for ${title} drop in here, oldest on the left.</div>`}</div>`}
      ${side&&html`<aside class="kside">
        ${side==='allday'?html`<${Fragment}><h3>All day · ${title}</h3><${AllDay} tks=${scopeTks}/><//>`
        :html`<${Fragment}><h3>Recall a ticket</h3><p style=${{margin:0,fontSize:13,color:'var(--k-ink-2)'}}>Bumped by mistake? Bring it back to the rail.</p>
          ${recallList.length?recallList.map(k=>html`<div class="rc-row" key=${k.id}><b>${k.table}</b><button class="kmini" onClick=${()=>{setStatus(k,'preparing');toast(k.table+' is back on the rail.')}}>Bring back</button><small>${k.no} · ${ST[k.station].name} · ${k.status==='served'?'served':'ready'} ${clock(k.readyAt||now)}</small></div>`)

      <span class="sp"></span><span class="hide-s">Tap a line to cross it off. Start, then Ready, bumps the ticket to the floor.</span></footer>
  </div>`;
}
function Ticket({k,now,onStart,onReady,onStrike}){

function AllDay({tks}){
  const agg={};
  tks.forEach(k=>k.lines.forEach(l=>{if(l.void||k.struck[l.lid])return;const a=agg[l.name]=agg[l.name]||{n:0,mods:{}};a.n+=l.qty;l.mods.forEach(m=>{a.mods[m]=(a.mods[m]||0)+l.qty})}));
  const rows=Object.entries(agg).sort((a,b)=>b[1].n-a[1].n);
  if(!rows.length)return html`<p style=${{color:'var(--k-ink-2)',fontSize:13}}>Nothing to cook right now.</p>`;
  return rows.map(([name,a])=>html`<div class="ad-row" key=${name}><b>${a.n}</b><span>${name}${Object.keys(a.mods).length?html`<small>${Object.entries(a.mods).map(([m,n])=>n+' '+m.toLowerCase()).join(' · ')}</small>`:null}</span></div>`);
}

function InvCount({inv,loc,me,now,nextCount}){

    <section class="panel">

    <//>`}
  </div>`;

     :me.role==='waiter'?html`<${WaiterApp} key=${me.id} me=${me} signOut=${out}/>`
     :me.role==='cook'?html`<${KitchenApp} key=${me.id} me=${me} signOut=${out}/>`
     :me.role==='cashier'?html`<${CashierApp} key=${me.id} me=${me} signOut=${out}/>`
     :me.role==='manager'?html`<${ManagerApp} key=${me.id} me=${me} signOut=${out}/>`
     :me.role==='store'?html`<${StoreApp} key=${me.id} me=${me} signOut=${out}/>`
     :html`<${InventoryApp} key=${me.id} me=${me} signOut=${out}/>`}
    <${Proto} me=${me} setMe=${setMe} forgetDevice=${()=>{setMe(null);setAcct(false);setDev(null)}}/>
    <${Toasts}/>
  <//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
})();
</script>
